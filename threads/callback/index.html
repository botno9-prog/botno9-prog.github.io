<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Threads 연결 | 착한발</title>
<link rel="icon" href="../../assets/icon-32.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f6; color: #173659;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; padding: 20px; box-sizing: border-box; }
  .box { max-width: 460px; width: 100%; background: #fff; border-radius: 20px; padding: 32px; text-align: center;
    box-shadow: 0 2px 16px rgba(23, 54, 89, .06); }
  img { width: 64px; margin: 0 auto 16px; display: block; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #6e7e90; margin: 0 0 20px; line-height: 1.6; }
  code { display: block; word-break: break-all; background: #f7ece9; border-radius: 10px; padding: 14px; font-size: 13px;
    color: #173659; text-align: left; }
  button { margin-top: 14px; border: 0; background: #173659; color: #fff; padding: 12px 22px; border-radius: 999px;
    font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <img src="../../assets/logo-symbol.png" alt="착한발">
  <h1 id="title">Threads 연결 페이지</h1>
  <p id="desc">착한발 업무 시스템과 Threads 계정을 연결할 때 쓰는 페이지입니다.</p>
  <div id="result"></div>
</div>
<script>
  // Threads 인증 후 돌아오는 주소: ?code=XXXX#_  (끝의 #_ 는 코드가 아니다)
  // 이 페이지는 코드를 화면에만 보여 주고, 어디에도 보내거나 저장하지 않는다.
  var params = new URLSearchParams(location.search);
  var code = params.get("code"), error = params.get("error_description") || params.get("error");
  var title = document.getElementById("title"), desc = document.getElementById("desc"), result = document.getElementById("result");
  if (code) {
    title.textContent = "연결 승인 완료";
    desc.textContent = "아래 인증 코드를 복사해 스빅 연결 창에 붙여넣어 주세요. 1시간 안에, 한 번만 쓸 수 있어요.";
    var box = document.createElement("code"); box.textContent = code; result.appendChild(box);
    var btn = document.createElement("button"); btn.textContent = "코드 복사";
    btn.onclick = function () { navigator.clipboard.writeText(code).then(function () { btn.textContent = "복사했어요"; }); };
    result.appendChild(btn);
    history.replaceState(null, "", location.pathname); // 주소창에서 코드를 지운다
  } else if (error) {
    title.textContent = "연결이 취소되었어요";
    desc.textContent = error;
  }
</script>
</body>
</html>
